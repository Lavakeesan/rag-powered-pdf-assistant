version: '3.8'

services:
  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    restart: always
    depends_on:
      - backend
